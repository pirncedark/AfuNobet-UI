<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="AfuNobet UI — your AI coding agents, at a glance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d1a"/>
      <stop offset="0.55" stop-color="#1b1a35"/>
      <stop offset="1" stop-color="#2c2a5a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b86ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a9a5ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b86ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff3d6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>
  <style>
    .w { fill: none; stroke: url(#wave); stroke-width: 2; stroke-dasharray: 900 1400; animation: flow 9s linear infinite; }
    .w2 { animation-duration: 12s; animation-delay: -4s; opacity: .6; }
    .w3 { animation-duration: 15s; animation-delay: -8s; opacity: .4; }
    @keyframes flow { from { stroke-dashoffset: 2300; } to { stroke-dashoffset: 0; } }

    .island { transform-origin: 600px 34px; animation: island 7s cubic-bezier(.6,0,.2,1) infinite; }
    @keyframes island {
      0%, 8%   { transform: scale(.32, .55); }
      18%, 82% { transform: scale(1, 1); }
      92%, 100%{ transform: scale(.32, .55); }
    }
    .inside { animation: inside 7s ease infinite; }
    @keyframes inside { 0%, 16% { opacity: 0; } 22%, 78% { opacity: 1; } 84%, 100% { opacity: 0; } }

    .dot { animation: blink 1.4s ease-in-out infinite; }
    .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; }
    @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

    .chip { opacity: 0; animation: chip 9s ease infinite; }
    .c2 { animation-delay: 3s; } .c3 { animation-delay: 6s; }
    @keyframes chip { 0% { opacity: 0; transform: translateY(6px); } 4%, 30% { opacity: 1; transform: translateY(0); } 34%, 100% { opacity: 0; transform: translateY(-6px); } }

    .fade { opacity: 0; animation: fade 1.2s ease .3s forwards; }
    .fade2 { animation-delay: .8s; } .fade3 { animation-delay: 1.3s; }
    @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif; }
    .t1 { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; }
    .t2 { font-size: 22px; fill: #c9c6e8; }
    .t3 { font-size: 15px; fill: #9a97c4; letter-spacing: 3px; }
    .ct { font-size: 14px; font-weight: 600; fill: #f2f2ff; }

    @media (prefers-reduced-motion: reduce) {
      .w, .island, .inside, .dot, .chip, .fade { animation: none; opacity: 1; transform: none; }
      .c2, .c3 { opacity: 0; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <path class="w"    d="M-50 330 C 250 180, 420 400, 700 250 S 1100 120, 1260 210"/>
    <path class="w w2" d="M-50 370 C 300 260, 520 420, 820 300 S 1120 230, 1260 290"/>
    <path class="w w3" d="M-50 250 C 200 120, 480 300, 760 170 S 1080 60, 1260 120"/>

    <!-- the island at the top of the screen -->
    <g class="island">
      <rect x="380" y="0" width="440" height="68" rx="26" fill="#050508"/>
      <rect x="380" y="0" width="440" height="30" fill="#050508"/>
      <g class="inside">
        <circle cx="430" cy="38" r="22" fill="url(#glow)"/>
        <rect x="414" y="24" width="32" height="28" rx="7" fill="#1d1c33" stroke="#8b86ff" stroke-width="1.5"/>
        <path d="M421 33 l6 5 -6 5" fill="none" stroke="#c9c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="430" y1="44" x2="439" y2="44" stroke="#c9c6ff" stroke-width="2" stroke-linecap="round"/>
        <text x="462" y="35" style="font-size:14px;font-weight:700;fill:#fff">Claude Code</text>
        <text x="462" y="53" style="font-size:12px;fill:#8d8aa8">Edit · src/invoice.ts</text>
        <circle class="dot"    cx="736" cy="38" r="4" fill="#8b86ff"/>
        <circle class="dot d2" cx="750" cy="38" r="4" fill="#8b86ff"/>
        <circle class="dot d3" cx="764" cy="38" r="4" fill="#8b86ff"/>
      </g>
    </g>

    <g class="fade"><text class="t1" x="600" y="178" text-anchor="middle" fill="url(#title)">AfuNobet UI</text></g>
    <g class="fade fade2"><text class="t2" x="600" y="218" text-anchor="middle">Your AI coding agents, at a glance — approve, chat and drop files without leaving your work.</text></g>
    <g class="fade fade3"><text class="t3" x="600" y="256" text-anchor="middle">WINDOWS · LINUX · MACOS</text></g>

    <!-- rotating status chips -->
    <g transform="translate(600 306)">
      <g class="chip">
        <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#16311f" stroke="#2fbf71"/>
        <circle cx="-114" cy="0" r="6" fill="#2fbf71"/>
        <text class="ct" x="8" y="5" text-anchor="middle">Session finished · 4 files</text>
      </g>
      <g class="chip c2">
        <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#3a2a10" stroke="#f0a43a"/>
        <circle cx="-114" cy="0" r="6" fill="#f0a43a"/>
        <text class="ct" x="8" y="5" text-anchor="middle">Permission · Deny / Allow</text>
      </g>
      <g class="chip c3">
        <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#221f45" stroke="#8b86ff"/>
        <circle cx="-114" cy="0" r="6" fill="#8b86ff"/>
        <text class="ct" x="8" y="5" text-anchor="middle">Thinking…  Read · Edit · Bash</text>
      </g>
    </g>
  </g>
</svg>
